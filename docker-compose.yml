services:
  postgres:
    image: postgres:16-alpine
    container_name: cibc_demo_postgres
    environment:
      POSTGRES_USER: cibc_demo
      POSTGRES_PASSWORD: cibc_demo
      POSTGRES_DB: cibc_demo
    ports:
      - "5433:5432"
    volumes:
      - cibc_demo_pgdata:/var/lib/postgresql/data

volumes:
  cibc_demo_pgdata:
